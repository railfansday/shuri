name: Generate Paginated Article Index (400 per page)

on:
  workflow_dispatch: # Bisa dijalankan manual kapan saja via tab Actions

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Jalankan Skrip Python Pembuat Indeks
        run: |
          python3 - << 'EOF'
          import os
          import re

          html_files = []
          # Scan semua file HTML di root (kecuali file indeks atau folder sistem)
          for root, dirs, files in os.walk("."):
              if ".github" in root or ".git" in root or "shuriken" in root:
                  continue
              for file in files:
                  if file.endswith(".html") and file != "index.html" and not file.startswith("page-"):
                      file_path = os.path.join(root, file)
                      # Ambil judul dari tag <title> jika ada
                      try:
                          with open(file_path, "r", encoding="utf-8", errors="ignore") as f:
                              content = f.read()
                              match = re.search(r'<title>(.*?)</title>', content, re.IGNORECASE)
                              title = match.group(1).strip() if match else file
                      except:
                          title = file
                      html_files.append({"path": file, "title": title})

          # Urutkan berdasarkan nama file/path agar rapi
          html_files = sorted(html_files, key=lambda x: x["path"])
          total_articles = len(html_files)
          print(f"Total artikel ditemukan: {total_articles}")

          # Bagi menjadi 400 artikel per halaman
          chunk_size = 400
          chunks = [html_files[i:i + chunk_size] for i in range(0, total_articles, chunk_size)]
          total_pages = len(chunks) if chunks else 1

          for idx, chunk in enumerate(chunks):
              page_num = idx + 1
              filename = "index.html" if page_num == 1 else f"page-{page_num}.html"
              
              items_html = ""
              for item in chunk:
                  items_html += f'<li><a href="{item["path"]}">{item["title"]}</a></li>\n'
              
              # Tombol navigasi halaman (Pagination)
              pagination_html = '<div style="margin-top: 30px; text-align: center;">'
              if page_num > 1:
                  prev_file = "index.html" if page_num == 2 else f"page-{page_num-1}.html"
                  pagination_html += f'<a href="{prev_file}" style="margin-right: 15px; padding: 8px 15px; background: #0066cc; color: white; text-decoration: none; border-radius: 4px;">&laquo; Sebelumnya</a>'
              
              pagination_html += f'<span>Halaman {page_num} dari {total_pages}</span>'
              
              if page_num < total_pages:
                  next_file = f"page-{page_num+1}.html"
                  pagination_html += f'<a href="{next_file}" style="margin-left: 15px; padding: 8px 15px; background: #0066cc; color: white; text-decoration: none; border-radius: 4px;">Berikutnya &raquo;</a>'
              
              pagination_html += '</div>'

              page_content = f"""<!DOCTYPE html>
              <html lang="id">
              <head>
                  <meta charset="UTF-8">
                  <meta name="viewport" content="width=device-width, initial-scale=1.0">
                  <title>Daftar Artikel - Halaman {page_num}</title>
                  <style>
                      body {{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 20px; line-height: 1.6; color: #333; }}
                      h1 {{ border-bottom: 2px solid #eaeaea; padding-bottom: 10px; }}
                      ul {{ list-style-type: disc; padding-left: 20px; }}
                      li {{ margin-bottom: 8px; }}
                      a {{ color: #0066cc; text-decoration: none; }}
                      a:hover {{ text-decoration: underline; }}
                  </style>
              </head>
              <body>
                  <h1>Daftar Artikel (Halaman {page_num})</h1>
                  <p>Menampilkan {len(chunk)} artikel pada halaman ini (Total: {total_articles} artikel).</p>
                  <ul>
                      {items_html}
                  </ul>
                  {pagination_html}
              </body>
              </html>
              """
              
              with open(filename, "w", encoding="utf-8") as f:
                  f.write(page_content)
              print(f"Berhasil membuat {filename} dengan {len(chunk)} artikel.")
          EOF

      - name: Commit dan Push Indeks ke Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html page-*.html
          git commit -m "📑 Generate paginated index (400 articles per page)" || echo "Tidak ada perubahan"
          git push
