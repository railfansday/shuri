name: Extract Shuriken ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'shuriken-7.0.49.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract shuriken-7.0.49.zip
        run: |
          if [ -f "shuriken-7.0.49.zip" ]; then
            echo "Menghapus file shuriken lama jika bentrok..."
            rm -f shuriken
            echo "Mengekstrak shuriken-7.0.49.zip..."
            unzip -o "shuriken-7.0.49.zip" -d .
            rm -f "shuriken-7.0.49.zip"
          else
            echo "File shuriken-7.0.49.zip tidak ditemukan."
          fi

      - name: Commit and Push Extracted Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "📦 Extract shuriken-7.0.49.zip" || echo "Tidak ada file baru untuk di-commit"
          git push
